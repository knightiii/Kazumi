name: armv7-apk

# 只为 32 位 (armeabi-v7a) 投影仪产出一个 APK，不动上游的 release 流程。
# 用法：放到 fork 的 .github/workflows/armv7-apk.yaml → Actions → armv7-apk → Run workflow
on:
  workflow_dispatch:

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        id: flutter-action
        with:
          channel: stable

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Remove build id
        run: |
          f=$(ls -d "${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}"/hosted/pub.dev/jni-*/src/CMakeLists.txt 2>/dev/null | head -1)
          if [ -n "$f" ]; then sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$f"; else echo "jni CMakeLists 未找到，跳过"; fi

      - name: Build armeabi-v7a APK
        run: >-
          flutter build apk --release --target-platform android-arm
          --dart-define=DANDANAPI_APPID=${{ secrets.DANDANAPI_APPID }}
          --dart-define=DANDANAPI_KEY=${{ secrets.DANDANAPI_KEY }}
          --dart-define=KAZUMI_APPID=${{ secrets.KAZUMI_APPID }}
          --dart-define=KAZUMI_KEY=${{ secrets.KAZUMI_KEY }}

      - name: Show ABI of produced APK
        run: |
          ls -l build/app/outputs/flutter-apk/
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -E 'lib/|\.so' | head -20

      - name: Upload armv7 apk
        uses: actions/upload-artifact@v4
        with:
          name: armv7
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
